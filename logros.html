<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREYA SKYE MUSIC - Logros</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .achievements-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .achievement-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 13, 26, 0.8);
            border: 2px solid rgba(0, 243, 255, 0.2);
            border-radius: 15px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked {
            border-color: #00ff80;
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.3);
            background: rgba(0, 255, 128, 0.05);
            cursor: pointer; /* Cambia el cursor para indicar que se puede pinchar */
        }

        .achievement-card.unlocked:hover {
            transform: scale(1.02);
            border-color: #00ff80;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.4);
        }

        .achievement-card.locked {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .achievement-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            flex-shrink: 0;
        }

        .achievement-card.unlocked .achievement-img {
            border-color: #00ff80;
            box-shadow: 0 0 10px rgba(0, 255, 128, 0.8);
        }

        .achievement-info {
            text-align: left;
        }

        .achievement-info h3 {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 3px;
        }

        .achievement-info p {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .status-tag {
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }

        .unlocked .status-tag {
            background: rgba(0, 255, 128, 0.2);
            color: #00ff80;
        }

        .locked .status-tag {
            background: rgba(255, 255, 255, 0.1);
            color: #a0aec0;
        }

        /* --- Modal de Zoom --- */
        .zoom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .zoom-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .zoom-content {
            background: linear-gradient(135deg, #121629 0%, #0a0d1a 100%);
            border: 2px solid #00ff80;
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 128, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .zoom-modal.show .zoom-content {
            transform: scale(1);
        }
        .zoom-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff80;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.8);
            margin-bottom: 15px;
        }
        .zoom-content h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .zoom-content p {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="menu-body">

    <div class="arcade-container">
        <div class="menu-screen">
            <div class="menu-content" style="max-width: 420px;">
                <h1 class="game-title" style="font-size: 1.8rem;">SALA DE <span>LOGROS</span></h1>
                <p class="game-subtitle">¡Desbloquea todas las insignias!</p>

                <div class="achievements-grid" id="achievements-container">
                    <!-- Se genera dinámicamente desde JS -->
                </div>

                <a href="index.html" class="neon-btn secondary" style="margin-top: 10px; width: 100%; text-decoration: none;">Volver al Menú</a>
            </div>
        </div>
    </div>

    <!-- Audio de la Intro en la pantalla de Logros -->
    <audio id="intro-audio" src="canciones/intro.mp3" loop preload="auto"></audio>

    <!-- Modal de Zoom para los logros -->
    <div id="zoom-modal" class="zoom-modal">
        <div class="zoom-content">
            <img id="zoom-img" src="" alt="Logro Grande" class="zoom-img">
            <h3 id="zoom-title">Título</h3>
            <p id="zoom-desc">Descripción</p>
            <button id="zoom-close" class="neon-btn" style="padding: 10px; font-size: 0.9rem;">Cerrar</button>
        </div>
    </div>

    <script>
        const introAudio = document.getElementById('intro-audio');

        // Reproducir automáticamente la música de fondo en la página de logros
        introAudio.play().catch(() => {
            const unlockAudio = () => {
                introAudio.play();
                window.removeEventListener('click', unlockAudio);
                window.removeEventListener('touchstart', unlockAudio);
            };
            window.addEventListener('click', unlockAudio);
            window.addEventListener('touchstart', unlockAudio);
        });

        const ALL_ACHIEVEMENTS = [
            { id: 'logro0', title: 'Ritmo Inicial', desc: 'Consigue un combo de 10', img: 'logros/logro0.png' },
            { id: 'logro1', title: 'Fiebre del Neón', desc: 'Activa el Modo Fever 30 veces', img: 'logros/logro1.png' },
            { id: 'logro2', title: 'Estrella Naciente', desc: 'Alcanza 50.000 puntos', img: 'logros/logro2.png' },
            { id: 'logro3', title: 'Dominador del Teclado', desc: 'Alcanza 100.000 puntos', img: 'logros/logro3.png' },
            { id: 'logro4', title: 'Incapaz de Fallar', desc: 'Consigue un combo de 50', img: 'logros/logro4.png' },
            { id: 'logro5', title: 'Maestro del Ritmo', desc: 'Alcanza 150.000 puntos', img: 'logros/logro5.png' },
            { id: 'logro6', title: 'Pulso de Acero', desc: 'Consigue un combo de 75', img: 'logros/logro6.png' },
            { id: 'logro7', title: 'Leyenda Absoluta', desc: 'Alcanza 200.000 puntos', img: 'logros/logro7.png' }
        ];

        const unlocked = JSON.parse(localStorage.getItem('freyaSkyeAchievements') || '[]');
        const container = document.getElementById('achievements-container');

        // Referencias del Modal de Zoom
        const zoomModal = document.getElementById('zoom-modal');
        const zoomImg = document.getElementById('zoom-img');
        const zoomTitle = document.getElementById('zoom-title');
        const zoomDesc = document.getElementById('zoom-desc');
        const zoomClose = document.getElementById('zoom-close');

        zoomClose.addEventListener('click', () => {
            zoomModal.classList.remove('show');
        });

        zoomModal.addEventListener('click', (e) => {
            if (e.target === zoomModal) {
                zoomModal.classList.remove('show');
            }
        });

        ALL_ACHIEVEMENTS.forEach(ach => {
            const isUnlocked = unlocked.includes(ach.id);
            const card = document.createElement('div');
            card.className = `achievement-card ${isUnlocked ? 'unlocked' : 'locked'}`;
            
            card.innerHTML = `
                <img src="${ach.img}" alt="${ach.title}" class="achievement-img" onerror="this.src='https://via.placeholder.com/55?text=🏆'">
                <div class="achievement-info">
                    <h3>${ach.title}</h3>
                    <p>${ach.desc}</p>
                    <span class="status-tag">${isUnlocked ? 'DESBLOQUEADO ✔' : 'BLOQUEADO 🔒'}</span>
                </div>
            `;

            // Si está desbloqueado, al hacer clic se abre el modal con la imagen grande
            if (isUnlocked) {
                card.addEventListener('click', () => {
                    zoomImg.src = ach.img;
                    zoomTitle.textContent = ach.title;
                    zoomDesc.textContent = ach.desc;
                    zoomModal.classList.add('show');
                });
            }

            container.appendChild(card);
        });
    </script>
</body>
</html>
