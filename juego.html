<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FREYA SKYE MUSIC - Partida</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- TODO EL JUEGO DEBE ESTAR DENTRO DE ESTE CONTENEDOR -->
    <div class="arcade-container">
        
        <div class="game-screen">
            <!-- Header con Puntuación, Combo y Vidas -->
            <header class="game-header">
                <div class="stat-box">
                    <span>SCORE</span>
                    <strong id="score-el">0</strong>
                </div>
                <div class="stat-box">
                    <span>COMBO</span>
                    <strong id="combo-el">0</strong>
                </div>
                <div class="stat-box">
                    <span>LIVES</span>
                    <strong id="lives-el">❤️❤️❤️</strong>
                </div>
                <button id="pause-btn" class="pause-btn">⏸</button>
            </header>

            <!-- Barra de Progreso de la Canción -->
            <div class="song-progress-container">
                <div class="progress-info">
                    <span id="song-title-display">Cargando...</span>
                    <span id="time-display">00:00 / 02:00</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Tablero de Carriles y Notas -->
            <div class="game-board">
                <div class="lane"><div class="target-circle"></div></div>
                <div class="lane"><div class="target-circle"></div></div>
                <div class="lane"><div class="target-circle"></div></div>
                <div class="lane"><div class="target-circle"></div></div>
                <div id="feedback-txt" class="feedback-text"></div>
            </div>
        </div>

    </div>

    <!-- Modal de Pausa / Game Over / Victoria -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title">¡PAUSA!</h2>
            <div id="final-score">
                <!-- Se rellena con JavaScript -->
            </div>
            <div class="modal-buttons">
                <button id="resume-btn" class="neon-btn">Reanudar</button>
                <button id="menu-btn" class="neon-btn secondary">Menú Principal</button>
            </div>
        </div>
    </div>

    <!-- Audio del Juego -->
    <audio id="game-audio" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
